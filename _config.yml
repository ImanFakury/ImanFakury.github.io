# Basic Site Settings
locale                   : "en-US"
site_theme               : "air" # Minimal light theme; options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Iman Alizadeh Fakouri"
title_separator          : "-"
name                     : &name "Iman Alizadeh Fakouri"
